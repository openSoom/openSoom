[basic.config]
cseType=IN
cseID=opensoom-in
cseName=cse-in
adminID=CAdmin
serviceProviderID=//opensoom.example
networkInterface=127.0.0.1
cseHost=127.0.0.1
httpPort=8080
databaseType=tinydb
logLevel=warning
consoleTheme=dark

[cse]
enableRemoteCSE=false
releaseVersion=4

[cse.security]
enableACPChecks=true

[http]
enableManagementEndpoint=false
enableStructureEndpoint=false
enableUpperTesterEndpoint=false

[mqtt]
enable=false

[websocket]
enable=false

[coap]
enable=false

[logging]
enableScreenLogging=true
enableFileLogging=false

[textui]
startWithTUI=false
